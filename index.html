<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WestJet OCC Delay Risk Agent — Playback</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; height: 100%; background: #1f1f1f; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    .stage { position: fixed; inset: 0 0 56px 0; background: #fff; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0; height: 56px;
      display: flex; align-items: center; justify-content: center; gap: 16px;
      background: #2a2a2a; color: #fff; border-top: 1px solid #3a3a3a;
    }
    button {
      background: #4b53bc; color: #fff; border: 0; border-radius: 6px;
      padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #5d66d5; }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }
    .step { min-width: 70px; text-align: center; font-variant-numeric: tabular-nums; }
    .hint { position: fixed; top: 12px; right: 16px; color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <div class="stage"><iframe id="frame" src="screens/screen-01.html"></iframe></div>
  <div class="bar">
    <button id="prev">‹ Prev</button>
    <div class="step" id="step">1 / 5</div>
    <button id="next">Next ›</button>
  </div>
  <div class="hint">Click the Send button in the chat, or use ← / → / space</div>

  <!-- Highlight-and-hook stylesheet that gets injected into each iframe. -->
  <style id="hook-style" hidden>
    [data-demo-send] {
      cursor: pointer !important;
      outline: 3px solid #4b53bc !important;
      outline-offset: 2px !important;
      border-radius: 6px !important;
      animation: demo-pulse 1.4s ease-in-out infinite;
    }
    @keyframes demo-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(75, 83, 188, 0.55); }
      50%      { box-shadow: 0 0 0 8px rgba(75, 83, 188, 0); }
    }
  </style>

  <script>
    const total = 5;
    let i = 1;
    const frame = document.getElementById('frame');
    const step = document.getElementById('step');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const hookCSS = document.getElementById('hook-style').textContent;

    function show(n) {
      i = Math.max(1, Math.min(total, n));
      frame.src = `screens/screen-${String(i).padStart(2, '0')}.html`;
      step.textContent = `${i} / ${total}`;
      prev.disabled = i === 1;
      next.disabled = i === total;
    }

    // When the iframe finishes loading each screen, reach in and:
    //  1. Find Teams' Send button (aria-label starts with "Send")
    //  2. Wire it to advance to the next screen
    //  3. Highlight it with a pulsing outline so it's obviously the click target
    //  4. Scroll the iframe so the compose bar (and the button) is in view
    // The iframe is same-origin (both served from http://127.0.0.1:8765) so
    // contentDocument is readable — no postMessage plumbing needed.
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc) return;

      // Inject our highlight stylesheet once per screen load.
      const style = doc.createElement('style');
      style.textContent = hookCSS;
      doc.head.appendChild(style);

      const send = doc.querySelector('[aria-label^="Send"]');
      if (send) {
        send.setAttribute('data-demo-send', '');
        // Use capture to fire before Teams' own (nonfunctional) click handlers.
        send.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation();
          show(i + 1);
        }, true);

        // The compose bar sits at the bottom of the Teams layout — pull it
        // into view so the user can find the button without hunting.
        send.scrollIntoView({ block: 'center', behavior: 'auto' });
      }
    });

    prev.addEventListener('click', () => show(i - 1));
    next.addEventListener('click', () => show(i + 1));
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); show(i + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); show(i - 1); }
    });
    show(1);
  </script>
</body>
</html>
